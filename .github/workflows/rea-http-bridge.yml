name: REA HTTP MCP Bridge contract tests
on:
  pull_request:
    paths:
      - "integrations/chatgpt-termux-bridge/**"
      - ".github/workflows/rea-http-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate JavaScript syntax
        run: |
          node --check integrations/chatgpt-termux-bridge/server.mjs
          node --check integrations/chatgpt-termux-bridge/server.test.mjs
      - name: Test JSON-RPC forwarding, session isolation and bearer authorization
        run: node --test integrations/chatgpt-termux-bridge/server.test.mjs
